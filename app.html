<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — Examination Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --primary:#5b7fff; --primary-2:#8a6bff; --cyan:#57d9e8;
    --success:#34d399; --warning:#fbbf24; --danger:#f87171;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter,sans-serif;
    background:#f6f7fb;
    color:#111827;
  }
  .dark body{
    background:#090b14;
    color:#eef2ff;
  }
  .font-display{font-family:'Space Grotesk',sans-serif}
  .focus-ring:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(91,127,255,.35)}
  .glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .premium-shell{background:radial-gradient(1300px 700px at 20% -20%, rgba(91,127,255,.14), transparent 55%)}
  .auth-overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgba(7,11,20,.48);backdrop-filter:blur(12px)}
  .auth-scene{position:relative;width:min(90vw,460px);height:420px;display:grid;place-items:center;perspective:1200px}
  .auth-portal{position:absolute;inset:12% 14%;border-radius:32px;background:radial-gradient(circle at center, rgba(91,127,255,.25), rgba(91,127,255,.04) 25%, rgba(9,11,20,.06) 45%, rgba(9,11,20,0) 65%);box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 20px 90px rgba(91,127,255,.22);transform:rotateX(60deg) scale(1.1);animation:portalPulse 2.2s ease-in-out infinite alternate}
  .auth-card{position:relative;z-index:1;width:min(90%,370px);padding:24px 22px 20px;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:rgba(7,10,18,.68);box-shadow:0 26px 80px rgba(7,10,18,.6);text-align:center;backdrop-filter:blur(16px)}
  .auth-mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:linear-gradient(135deg,#5b7fff,#8a6bff);font-size:28px;font-weight:700;color:white;box-shadow:0 14px 28px rgba(91,127,255,.45)}
  .auth-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .auth-welcome{margin:12px 0 6px;font-size:38px;line-height:1;font-family:'Space Grotesk',sans-serif}
  .auth-name{font-size:16px;color:rgba(255,255,255,.9)}
  .auth-subtitle{margin:8px 0 18px;font-size:13px;color:rgba(255,255,255,.6)}
  .auth-profile{display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);text-align:left}
  .auth-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#5b7fff,#57d9e8);font-weight:700;color:white}
  .auth-meta{display:flex;flex-direction:column;gap:2px}
  .auth-meta strong{font-size:14px}
  .auth-meta small{color:rgba(255,255,255,.65)}
  @keyframes portalPulse{0%{transform:rotateX(60deg) scale(1.02);opacity:.8}100%{transform:rotateX(60deg) scale(1.12);opacity:1}}
  .error-shake{animation:errorShake .32s ease-in-out}
  @keyframes errorShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react">
  const { useState, useEffect, useRef, createContext, useContext } = React;

  const STORAGE_KEY = 'orbit_exam_system_v1';

  function buildEmptyDb() {
    return {
      users: [{
        id: 'ADM-001',
        role: 'admin',
        name: 'Orbit Admin',
        email: 'admin@orbit.edu',
        password: 'admin123',
        department: 'Administration',
        createdAt: Date.now(),
      }],
      exams: [],
      attempts: [],
      results: [],
      notifications: [],
    };
  }

  function readDb() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : buildEmptyDb();
    } catch {
      return buildEmptyDb();
    }
  }

  function writeDb(db) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    } catch {}
  }

  function generateId(prefix) {
    return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }

  function cx(...parts) {
    return parts.filter(Boolean).join(' ');
  }

  function fmtTime(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(value => String(value).padStart(2, '0')).join(':');
  }

  const AppCtx = createContext(null);

  function useApp() {
    return useContext(AppCtx);
  }

  function useHashRoute() {
    const [hash, setHash] = useState(window.location.hash || '#/');
    useEffect(() => {
      const onHashChange = () => setHash(window.location.hash || '#/');
      window.addEventListener('hashchange', onHashChange);
      return () => window.removeEventListener('hashchange', onHashChange);
    }, []);
    return hash;
  }

  function navigate(path) {
    window.location.hash = path;
  }

  function Card({ className, children }) {
    return (
      <div className={cx('rounded-2xl border border-black/5 bg-white shadow-sm dark:border-white/10 dark:bg-white/[0.04]', className)}>
        {children}
      </div>
    );
  }

  function Badge({ tone = 'neutral', children }) {
    const map = {
      neutral: 'bg-black/5 text-current dark:bg-white/10',
      success: 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400',
      warning: 'bg-amber-500/15 text-amber-600 dark:text-amber-400',
      danger: 'bg-red-500/15 text-red-600 dark:text-red-400',
      primary: 'bg-[#5b7fff]/15 text-[#5b7fff] dark:text-[#8ea3ff]',
    };
    return <span className={cx('inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium', map[tone])}>{children}</span>;
  }

  function EmptyState({ icon, title, subtitle, action }) {
    return (
      <div className="flex flex-col items-center justify-center px-6 py-16 text-center">
        <div className="mb-4 text-4xl opacity-70">{icon}</div>
        <h3 className="mb-1 font-display text-lg font-semibold">{title}</h3>
        <p className="mb-5 max-w-sm text-sm opacity-60">{subtitle}</p>
        {action}
      </div>
    );
  }

  function ProgressRing({ pct, size = 64, stroke = 6, color = 'var(--primary)', label }) {
    const radius = (size - stroke) / 2;
    const circumference = 2 * Math.PI * radius;
    const safePct = Math.min(100, Math.max(0, pct || 0));
    const offset = circumference - (safePct / 100) * circumference;

    return (
      <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
        <svg width={size} height={size} className="-rotate-90">
          <circle cx={size / 2} cy={size / 2} r={radius} stroke="currentColor" className="text-black/10 dark:text-white/10" strokeWidth={stroke} fill="none" />
          <circle
            cx={size / 2}
            cy={size / 2}
            r={radius}
            stroke={color}
            strokeWidth={stroke}
            fill="none"
            strokeDasharray={circumference}
            strokeDashoffset={offset}
            strokeLinecap="round"
            style={{ transition: 'stroke-dashoffset 0.6s ease' }}
          />
        </svg>
        <span className="absolute font-display font-semibold" style={{ fontSize: size * 0.22 }}>
          {label ?? `${Math.round(safePct)}%`}
        </span>
      </div>
    );
  }

  function ThemeToggle() {
    const { theme, setTheme } = useApp();
    const options = [['light', '☀'], ['dark', '🌙'], ['system', '🖥']];

    return (
      <div className="flex items-center gap-1 rounded-full border border-black/5 bg-black/5 p-1 dark:border-white/10 dark:bg-white/5">
        {options.map(([key, icon]) => (
          <button
            key={key}
            type="button"
            aria-label={`${key} theme`}
            aria-pressed={theme === key}
            onClick={() => setTheme(key)}
            className={cx('flex h-8 w-8 items-center justify-center rounded-full text-sm transition focus-ring', theme === key ? 'bg-white shadow dark:bg-white/15' : 'opacity-50 hover:opacity-80')}
          >
            {icon}
          </button>
        ))}
      </div>
    );
  }

  function Sidebar({ role }) {
    const hash = useHashRoute();
    const { logout } = useApp();
    const studentLinks = [
      ['#/dashboard', '🏠', 'Dashboard'],
      ['#/exams', '📝', 'Examinations'],
      ['#/history', '📚', 'History'],
      ['#/performance', '📈', 'Performance'],
      ['#/profile', '👤', 'Profile'],
    ];
    const adminLinks = [
      ['#/admin', '🏠', 'Dashboard'],
      ['#/admin/exams', '🗓', 'Exams'],
      ['#/admin/questions', '🗂', 'Questions'],
      ['#/admin/students', '🎓', 'Students'],
      ['#/admin/reports', '📄', 'Results'],
    ];
    const links = role === 'admin' ? adminLinks : studentLinks;

    return (
      <aside className="sticky top-0 hidden h-screen w-60 shrink-0 flex-col border-r border-black/5 px-4 py-6 dark:border-white/10 md:flex">
        <a href="index.html" className="mb-8 flex items-center gap-2 px-2 font-display font-semibold">
          <div className="h-6 w-6 rounded-full" style={{ background: 'conic-gradient(from 90deg, #5b7fff, #57d9e8, #8a6bff, #5b7fff)' }} />
          Orbit
        </a>
        <nav className="flex flex-col gap-1">
          {links.map(([href, icon, label]) => (
            <a
              key={href}
              href={href}
              className={cx(
                'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition focus-ring',
                hash === href || (hash === '#/' && href.endsWith('dashboard')) ? 'bg-[#5b7fff]/10 text-[#5b7fff]' : 'opacity-80 hover:bg-black/5 hover:opacity-100 dark:hover:bg-white/5'
              )}
            >
              <span>{icon}</span>
              {label}
            </a>
          ))}
        </nav>
        <div className="mt-auto">
          <button type="button" onClick={logout} className="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium opacity-70 transition hover:bg-black/5 hover:opacity-100 dark:hover:bg-white/5">
            🚪 Logout
          </button>
        </div>
      </aside>
    );
  }

  function Topbar({ title, subtitle }) {
    const { user, db } = useApp();
    const [open, setOpen] = useState(false);
    const notifications = [...((db.notifications || []).slice().reverse())].slice(0, 4);

    return (
      <header className="sticky top-0 z-20 flex items-center justify-between border-b border-black/5 bg-[#f6f7fb]/80 px-6 py-5 backdrop-blur-xl dark:border-white/10 dark:bg-[#090b14]/80">
        <div>
          <h1 className="font-display text-xl font-semibold">{title}</h1>
          {subtitle && <p className="text-sm opacity-60">{subtitle}</p>}
        </div>
        <div className="flex items-center gap-4">
          <button type="button" onClick={() => setOpen(value => !value)} className="relative flex h-9 w-9 items-center justify-center rounded-full hover:bg-black/5 focus-ring dark:hover:bg-white/5" aria-label="Notifications">
            🔔
            {notifications.length > 0 && <span className="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-[#f87171]" />}
          </button>
          <ThemeToggle />
          <div className="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold text-white" style={{ background: user?.avatarColor || '#5b7fff' }}>
            {user?.name?.split(' ').map(part => part[0]).join('').slice(0, 2) || 'O'}
          </div>
        </div>
        {open && (
          <div className="absolute right-6 top-16 z-30 w-80 rounded-2xl border border-black/5 bg-white p-2 shadow-xl dark:border-white/10 dark:bg-[#12142a]">
            <div className="px-3 py-2 text-sm font-semibold">Notifications</div>
            {notifications.length ? (
              notifications.map(item => (
                <div key={item.id || item.createdAt} className="flex gap-3 rounded-xl px-3 py-2.5 text-sm hover:bg-black/5 dark:hover:bg-white/5">
                  <span>{item.type === 'exam-integrity' ? '⚠️' : '✅'}</span>
                  <span className="opacity-80">{item.message || 'New activity detected.'}</span>
                </div>
              ))
            ) : (
              [
                ['⏰', 'No new notifications yet.'],
                ['✅', 'Your exam dashboard is ready.'],
              ].map(([icon, text], index) => (
                <div key={index} className="flex gap-3 rounded-xl px-3 py-2.5 text-sm hover:bg-black/5 dark:hover:bg-white/5">
                  <span>{icon}</span>
                  <span className="opacity-80">{text}</span>
                </div>
              ))
            )}
          </div>
        )}
      </header>
    );
  }

  function Shell({ role, title, subtitle, children }) {
    return (
      <div className="premium-shell flex min-h-screen">
        <Sidebar role={role} />
        <div className="min-w-0 flex-1">
          <Topbar title={title} subtitle={subtitle} />
          <main className="p-6 md:p-10">{children}</main>
        </div>
      </div>
    );
  }

  function AuthTransition({ role, name, id }) {
    const initials = (name || 'Student').split(' ').map(part => part[0]).join('').slice(0, 2);
    return (
      <div className="auth-overlay">
        <div className="auth-scene" aria-live="polite" aria-label="authentication success transition">
          <div className="auth-portal" />
          <div className="auth-card">
            <div className="auth-mark">✓</div>
            <div className="auth-kicker">Authentication successful</div>
            <h2 className="auth-welcome">Welcome back</h2>
            <div className="auth-name">Good to see you, {name}</div>
            <p className="auth-subtitle">Preparing your examination dashboard...</p>
            <div className="auth-profile">
              <div className="auth-avatar">{initials}</div>
              <div className="auth-meta">
                <strong>{name}</strong>
                <small>{role === 'admin' ? 'Exam Controller' : id}</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function StudentDashboard() {
    const { db, user } = useApp();
    const published = (db.exams || []).filter(exam => exam.status === 'published');
    const results = (db.results || []).filter(result => result.studentId === user.id);

    if (!published.length && !results.length) {
      return (
        <Shell role="student" title={`Welcome, ${user.name}`} subtitle="Your exam dashboard is ready.">
          <Card>
            <EmptyState icon="📘" title="No exams are currently available." subtitle="The admin must publish a real exam before it appears here." />
          </Card>
        </Shell>
      );
    }

    const completedCount = results.filter(item => item.passed).length;

    return (
      <Shell role="student" title={`Welcome, ${user.name}`} subtitle="Your exam dashboard is ready.">
        {published.length > 0 && (
          <Card className="mb-6 overflow-hidden border border-[#5b7fff]/15 bg-gradient-to-r from-[#5b7fff]/10 via-white to-[#8a6bff]/10 p-5 dark:border-[#8ea3ff]/20 dark:from-[#151e3f]/70 dark:via-[#0f172a] dark:to-[#1a1234]">
            <div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
              <div>
                <Badge tone="primary">Available now</Badge>
                <h3 className="mt-2 font-display text-xl font-semibold">{published[0].name}</h3>
                <p className="text-sm opacity-60">{published[0].subject} • {published[0].duration} minutes • {published[0].questions?.length || 0} questions</p>
              </div>
              <button type="button" onClick={() => navigate('#/exam/' + published[0].id)} className="rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-5 py-2.5 font-semibold text-white focus-ring">Start Exam →</button>
            </div>
          </Card>
        )}

        <div className="mb-8 grid gap-5 lg:grid-cols-3">
          <Card className="p-5 transition hover:-translate-y-0.5 hover:shadow-md">
            <p className="mb-1 text-sm opacity-60">Available exams</p>
            <p className="font-display text-3xl font-semibold">{published.length}</p>
          </Card>
          <Card className="p-5 transition hover:-translate-y-0.5 hover:shadow-md">
            <p className="mb-1 text-sm opacity-60">Attempt history</p>
            <p className="font-display text-3xl font-semibold">{results.length}</p>
          </Card>
          <Card className="p-5 transition hover:-translate-y-0.5 hover:shadow-md">
            <p className="mb-1 text-sm opacity-60">Passed</p>
            <p className="font-display text-3xl font-semibold">{completedCount}</p>
          </Card>
        </div>

        <div className="grid gap-5 lg:grid-cols-2">
          <div>
            <h2 className="mb-3 font-display text-xl font-semibold">Available Exams</h2>
            {published.length ? (
              <div className="space-y-4">
                {published.map(exam => (
                  <Card key={exam.id} className="p-5 transition hover:-translate-y-0.5 hover:shadow-md">
                    <div className="mb-2 flex items-center justify-between gap-3">
                      <Badge tone="primary">{exam.subject}</Badge>
                      <Badge tone={exam.status === 'published' ? 'success' : 'warning'}>{exam.status}</Badge>
                    </div>
                    <h3 className="font-display text-lg font-semibold">{exam.name}</h3>
                    <p className="mt-2 text-sm opacity-70">{exam.description || 'No description provided.'}</p>
                    <div className="mt-3 flex flex-wrap gap-3 text-xs font-mono opacity-70">
                      <span>⏱ {exam.duration} min</span>
                      <span>❓ {exam.questions?.length || 0} questions</span>
                      <span>🏁 Pass {exam.passPercent}%</span>
                    </div>
                    <button type="button" onClick={() => navigate('#/exam/' + exam.id)} className="mt-4 rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-4 py-2.5 font-semibold text-white focus-ring">View exam</button>
                  </Card>
                ))}
              </div>
            ) : (
              <Card><EmptyState icon="📝" title="No exams are currently available." subtitle="The admin must publish an exam to make it visible to students." /></Card>
            )}
          </div>

          <div>
            <h2 className="mb-3 font-display text-xl font-semibold">Examination History</h2>
            {results.length ? (
              <div className="space-y-3">
                {results.map(result => (
                  <Card key={result.id} className="p-4 transition hover:-translate-y-0.5 hover:shadow-sm">
                    <div className="flex items-center justify-between gap-3">
                      <div>
                        <div className="font-medium">{result.examName}</div>
                        <div className="text-xs opacity-60">{result.subject}</div>
                      </div>
                      <Badge tone={result.passed ? 'success' : 'danger'}>{result.passed ? 'Passed' : 'Failed'}</Badge>
                    </div>
                    <div className="mt-3 font-mono text-xs opacity-70">{result.score}/{result.totalMarks} • {result.percentage}%</div>
                  </Card>
                ))}
              </div>
            ) : (
              <Card><EmptyState icon="📚" title="No examination history yet." subtitle="Your previous attempts and results will appear here once you begin a real exam." /></Card>
            )}
          </div>
        </div>
      </Shell>
    );
  }

  function ExamsListPage() {
    const { db } = useApp();
    const published = (db.exams || []).filter(exam => exam.status === 'published');

    if (!published.length) {
      return (
        <Shell role="student" title="Examinations" subtitle="All available examinations.">
          <Card><EmptyState icon="📝" title="No exams are currently available." subtitle="New examinations become visible here once the admin publishes them." /></Card>
        </Shell>
      );
    }

    return (
      <Shell role="student" title="Examinations" subtitle="All available examinations.">
        <div className="mb-5 flex items-center justify-between">
          <div>
            <p className="text-sm opacity-60">{published.length} exam{published.length === 1 ? '' : 's'} available</p>
          </div>
          <Badge tone="primary">Live schedule</Badge>
        </div>
        <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          {published.map(exam => (
            <Card key={exam.id} className="p-5 transition hover:-translate-y-0.5 hover:shadow-md">
              <div className="mb-3 flex items-center justify-between">
                <Badge tone="primary">{exam.subject}</Badge>
                <Badge tone="success">Open</Badge>
              </div>
              <h3 className="mt-3 font-display text-lg font-semibold">{exam.name}</h3>
              <p className="mt-2 text-sm opacity-70">{exam.description || 'Exam information is currently being prepared.'}</p>
              <div className="mt-3 space-y-1 text-xs font-mono opacity-70">
                <div>Duration: {exam.duration} min</div>
                <div>Questions: {exam.questions?.length || 0}</div>
                <div>Marks: {exam.totalMarks}</div>
                <div>Pass: {exam.passPercent}%</div>
              </div>
              <button type="button" onClick={() => navigate('#/exam/' + exam.id)} className="mt-4 w-full rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-4 py-2.5 font-semibold text-white focus-ring">View details</button>
            </Card>
          ))}
        </div>
      </Shell>
    );
  }

  function HistoryPage() {
    const { db, user } = useApp();
    const results = (db.results || []).filter(item => item.studentId === user.id);

    if (!results.length) {
      return (
        <Shell role="student" title="Exam History" subtitle="Every attempt, all in one place.">
          <Card><EmptyState icon="📚" title="No examination history yet." subtitle="Your previous attempts and results will appear here once you start a real exam." /></Card>
        </Shell>
      );
    }

    return (
      <Shell role="student" title="Exam History" subtitle="Every attempt, all in one place.">
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-black/[0.02] text-left dark:bg-white/[0.03]">
              <tr>
                <th className="px-5 py-3 font-medium opacity-60">Exam</th>
                <th className="px-5 py-3 font-medium opacity-60">Subject</th>
                <th className="px-5 py-3 font-medium opacity-60">Date</th>
                <th className="px-5 py-3 font-medium opacity-60">Score</th>
                <th className="px-5 py-3 font-medium opacity-60">Status</th>
              </tr>
            </thead>
            <tbody>
              {results.map(result => (
                <tr key={result.id} className="border-t border-black/5 dark:border-white/5">
                  <td className="px-5 py-3.5 font-medium">{result.examName}</td>
                  <td className="px-5 py-3.5 opacity-70">{result.subject}</td>

  function AdminExamsPage() {
    const { db, updateDb } = useApp();
    const [showCreate, setShowCreate] = useState(false);
    const [form, setForm] = useState({
      name: '',
      subject: '',
      description: '',
      duration: '60',
      totalMarks: '100',
      passPercent: '40',
      instructions: 'Read the question carefully and answer confidently.',
    });

    const exams = db.exams || [];

    function createExam() {
      if (!form.name || !form.subject) return;
      const newExam = {
        id: generateId('exam'),
        name: form.name,
        subject: form.subject,
        description: form.description,
        duration: Number(form.duration) || 60,
        totalMarks: Number(form.totalMarks) || 100,
        passPercent: Number(form.passPercent) || 40,
        instructions: form.instructions,
        status: 'draft',
        questions: [],
        createdAt: Date.now(),
      };

      updateDb(current => ({ ...current, exams: [...(current.exams || []), newExam] }));
      setForm({ name: '', subject: '', description: '', duration: '60', totalMarks: '100', passPercent: '40', instructions: 'Read the question carefully and answer confidently.' });
      setShowCreate(false);
    }

    function toggleStatus(examId) {
      updateDb(current => ({
        ...current,
        exams: (current.exams || []).map(exam => exam.id === examId ? { ...exam, status: exam.status === 'published' ? 'draft' : 'published' } : exam),
      }));

    return (
      <Shell role="admin" title="Exams" subtitle="Create, publish, and manage examinations.">

                </tr>

              <tbody>
                {exams.map(exam => (
                  <tr key={exam.id} className="border-t border-black/5 dark:border-white/5">

                    <td className="px-5 py-3.5 opacity-70">{exam.duration} min</td>
                    <td className="px-5 py-3.5"><Badge tone={exam.status === 'published' ? 'success' : 'warning'}>{exam.status}</Badge></td>
                    <td className="px-5 py-3.5"><button type="button" onClick={() => toggleStatus(exam.id)} className="font-medium text-[#5b7fff] hover:underline">{exam.status === 'published' ? 'Unpublish' : 'Publish'}</button></td>
                  </tr>
                ))}

            </table>
          </Card>
        ) : (
          <Card><EmptyState icon="🗓" title="No exams available." subtitle="Create your first exam to make it visible to students." /></Card>
        )}

        {showCreate && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-6">
            <Card className="w-full max-w-lg p-6">
              <h3 className="mb-4 font-display text-lg font-semibold">Create examination</h3>
              <div className="grid gap-3 sm:grid-cols-2">
                <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Exam title" className="sm:col-span-2 w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <input value={form.subject} onChange={e => setForm({ ...form, subject: e.target.value })} placeholder="Subject" className="w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <input value={form.duration} onChange={e => setForm({ ...form, duration: e.target.value })} type="number" placeholder="Duration (min)" className="w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <input value={form.totalMarks} onChange={e => setForm({ ...form, totalMarks: e.target.value })} type="number" placeholder="Total marks" className="w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <input value={form.passPercent} onChange={e => setForm({ ...form, passPercent: e.target.value })} type="number" placeholder="Passing %" className="w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <textarea value={form.instructions} onChange={e => setForm({ ...form, instructions: e.target.value })} rows="3" placeholder="Exam instructions" className="sm:col-span-2 w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <textarea value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} rows="2" placeholder="Description" className="sm:col-span-2 w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
              </div>
              <div className="mt-5 flex gap-3">
                <button type="button" onClick={() => setShowCreate(false)} className="flex-1 rounded-xl bg-black/5 px-4 py-2.5 font-medium dark:bg-white/10">Cancel</button>
                <button type="button" onClick={createExam} className="flex-1 rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-4 py-2.5 font-semibold text-white">Save draft</button>
              </div>
            </Card>
          </div>
        )}
      </Shell>
    );
  }

  function AdminQuestionsPage() {
    const { db, updateDb } = useApp();
    const exams = (db.exams || []).filter(exam => exam.status === 'draft' || exam.status === 'published');
    const [selectedExamId, setSelectedExamId] = useState(exams[0]?.id || '');
    const [questionText, setQuestionText] = useState('');
    const [options, setOptions] = useState(['', '', '', '']);
    const [correctIndex, setCorrectIndex] = useState(0);

    if (!exams.length) {
      return (
        <Shell role="admin" title="Question Bank" subtitle="Add questions to your exams.">
          <Card><EmptyState icon="🗂" title="No exam exists yet." subtitle="Create an exam first, then add questions to it." /></Card>
        </Shell>
      );
    }

    const selectedExam = exams.find(exam => exam.id === selectedExamId) || exams[0];

    function addQuestion() {
      if (!questionText.trim()) return;
      const filled = options.map(value => value.trim()).filter(Boolean);
      if (filled.length < 4) return;

      const nextQuestion = {
        id: generateId('question'),
        text: questionText,
        options: filled,
        correct: Number(correctIndex),
        marks: 1,
      };

      updateDb(current => ({
        ...current,
        exams: (current.exams || []).map(exam => exam.id === selectedExam.id ? { ...exam, questions: [...(exam.questions || []), nextQuestion] } : exam),
      }));

      setQuestionText('');
      setOptions(['', '', '', '']);
      setCorrectIndex(0);
    }

    return (
      <Shell role="admin" title="Question Bank" subtitle="Add, update, and manage exam questions.">
        <div className="grid gap-5 lg:grid-cols-[1.2fr_0.8fr]">
          <Card className="p-5">
            <label className="mb-2 block text-xs opacity-60">Select exam</label>
            <select value={selectedExamId} onChange={e => setSelectedExamId(e.target.value)} className="w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5">
              {exams.map(exam => (
                <option key={exam.id} value={exam.id}>{exam.name}</option>
              ))}
            </select>

            {(selectedExam.questions || []).length ? (
              <div className="mt-5 space-y-3">
                {(selectedExam.questions || []).map((question, index) => (
                  <div key={question.id} className="rounded-xl border border-black/5 p-4 dark:border-white/10">
                    <p className="mb-2 font-medium">{index + 1}. {question.text}</p>
                    <ul className="list-disc space-y-1 pl-5 text-xs opacity-70">
                      {question.options.map((option, optionIndex) => (
                        <li key={optionIndex} className={optionIndex === question.correct ? 'text-emerald-600 dark:text-emerald-400' : ''}>{option}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            ) : (
              <div className="mt-5"><EmptyState icon="❔" title="No questions yet." subtitle="Add the first question for this exam." /></div>
            )}
          </Card>

          <Card className="p-5">
            <h3 className="mb-4 font-display text-lg font-semibold">Add question</h3>
            <textarea value={questionText} onChange={e => setQuestionText(e.target.value)} rows="3" placeholder="Question text" className="mb-3 w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
            {options.map((option, index) => (
              <div key={index} className="mb-2 flex items-center gap-2">
                <input value={option} onChange={e => {
                  const next = [...options];
                  next[index] = e.target.value;
                  setOptions(next);
                }} placeholder={`Option ${index + 1}`} className="flex-1 rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm focus-ring outline-none dark:border-white/10 dark:bg-white/5" />
                <button type="button" onClick={() => setCorrectIndex(index)} className={cx('rounded-lg px-2 py-2 text-xs font-medium', correctIndex === index ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400' : 'bg-black/5 dark:bg-white/10')}>{correctIndex === index ? 'Correct' : 'Set'}</button>
              </div>
            ))}
            <button type="button" onClick={addQuestion} className="mt-3 w-full rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-5 py-2.5 font-semibold text-white focus-ring">Add question</button>
          </Card>
        </div>
      </Shell>
    );
  }

  function AdminStudentsPage() {

  function ExamPage({ examId }) {
    const { db, user, updateDb } = useApp();
    const exam = (db.exams || []).find(item => item.id === examId);
    const [answers, setAnswers] = useState({});
    const [marked, setMarked] = useState({});
    const [current, setCurrent] = useState(0);
    const [showConfirm, setShowConfirm] = useState(false);
    const [submitted, setSubmitted] = useState(false);
    const [timeLeft, setTimeLeft] = useState(exam ? exam.duration * 60 : 0);
    const integrityEventLogged = useRef(false);

    useEffect(() => {
      if (!exam || !user) return;
      const existingAttempt = (db.attempts || []).find(item => item.examId === exam.id && item.studentId === user.id && !item.submittedAt);
      if (!existingAttempt) {
        updateDb(current => ({
          ...current,
          attempts: [...(current.attempts || []), { id: generateId('attempt'), examId: exam.id, studentId: user.id, startedAt: Date.now(), submittedAt: null }],
        }));
      }
    }, [exam, user, db.attempts, updateDb]);

    useEffect(() => {
      if (!exam || !user || submitted) return;

      const pushIntegrityAlert = reason => {
        if (integrityEventLogged.current) return;
        integrityEventLogged.current = true;

        updateDb(current => ({
          ...current,
          notifications: [
            {
              id: generateId('notification'),
              type: 'exam-integrity',
              studentId: user.id,
              studentName: user.name,
              examId: exam.id,
              examName: exam.name,
              reason,
              message: `${user.name} triggered an exam integrity alert during ${exam.name}: ${reason}`,
              createdAt: Date.now(),
            },
            ...(current.notifications || []),
          ],
        }));
      };

      const handleTabOrWindowLeave = () => {
        if (document.visibilityState === 'visible') {
          integrityEventLogged.current = false;
          return;
        }
        const reason = document.visibilityState === 'hidden'
          ? 'The student switched away from the exam tab or browser window.'
          : 'The student left the exam window during the attempt.';
        pushIntegrityAlert(reason);
      };

      const handleBlur = () => {
        if (document.visibilityState === 'visible') {
          integrityEventLogged.current = false;
          return;
        }
        pushIntegrityAlert('The student lost focus or left the exam screen while the exam was in progress.');
      };

      const handleFocus = () => {
        integrityEventLogged.current = false;
      };

      document.addEventListener('visibilitychange', handleTabOrWindowLeave);
      window.addEventListener('blur', handleBlur);
      window.addEventListener('focus', handleFocus);

      return () => {
        document.removeEventListener('visibilitychange', handleTabOrWindowLeave);
        window.removeEventListener('blur', handleBlur);
        window.removeEventListener('focus', handleFocus);
      };
    }, [exam, user, submitted, updateDb]);

    useEffect(() => {
      if (!exam || submitted) return;
      const timer = setInterval(() => {
        setTimeLeft(prev => {
          if (prev <= 1) {
            clearInterval(timer);
            setSubmitted(true);
            return 0;
          }
          return prev - 1;
        });
      }, 1000);
      return () => clearInterval(timer);
    }, [exam, submitted]);

    if (!exam) {
      return (
        <Shell role="student" title="Examination" subtitle="Real exam details.">
          <Card><EmptyState icon="⚠️" title="Unable to load this examination." subtitle="Please return to the list and try again." /></Card>
        </Shell>
      );
    }

    const questions = exam.questions || [];

    if (!questions.length) {
      return (
        <Shell role="student" title={exam.name} subtitle={exam.subject}>
          <Card><EmptyState icon="❔" title="No questions available for this exam." subtitle="This examination is not yet ready for student attempts." /></Card>
        </Shell>
      );
    }

    function selectAnswer(index, optionIndex) {
      setAnswers(prev => ({ ...prev, [index]: optionIndex }));
    }

    function toggleMark(index) {
      setMarked(prev => ({ ...prev, [index]: !prev[index] }));
    }

    function submitExam() {
      setSubmitted(true);
      let correct = 0;
      questions.forEach((question, index) => {
        if (answers[index] === question.correct) correct += 1;
      });

      const percentage = Math.round((correct / questions.length) * 100);
      const passed = percentage >= exam.passPercent;

      updateDb(current => ({
        ...current,
        results: [
          ...(current.results || []),
          {
            id: generateId('result'),
            studentId: user.id,
            studentName: user.name,
            examId: exam.id,
            examName: exam.name,
            subject: exam.subject,
            score: correct,
            totalMarks: exam.totalMarks,
            percentage,
            passed,
            createdAt: Date.now(),
          },
        ],
        attempts: (current.attempts || []).map(item => item.examId === exam.id && item.studentId === user.id && !item.submittedAt ? { ...item, submittedAt: Date.now() } : item),
      }));
    }

    if (submitted) {
      let correct = 0;
      questions.forEach((question, index) => {
        if (answers[index] === question.correct) correct += 1;
      });
      const percentage = Math.round((correct / questions.length) * 100);
      const passed = percentage >= exam.passPercent;

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#f6f7fb] via-white to-[#edf4ff] p-6 md:p-10 dark:from-[#090b14] dark:via-[#0d1220] dark:to-[#0a1020]">
          <Card className="mx-auto max-w-3xl overflow-hidden border border-[#5b7fff]/10 bg-white/80 p-0 shadow-[0_30px_80px_rgba(91,127,255,0.14)] backdrop-blur-xl dark:border-[#8ea3ff]/20 dark:bg-[#0f172a]/80">
            <div className="bg-gradient-to-r from-[#5b7fff]/10 via-[#8a6bff]/5 to-transparent p-6 text-center md:p-8">
              <Badge tone={passed ? 'success' : 'danger'}>{passed ? 'Pass' : 'Fail'}</Badge>
              <h1 className="mt-4 font-display text-3xl font-semibold">Exam Submitted</h1>
              <p className="mt-2 text-sm opacity-60">{exam.name}</p>
            </div>
            <div className="p-6 md:p-8">
              <div className="mt-2 flex justify-center">
                <ProgressRing pct={percentage} size={150} stroke={10} color={passed ? '#34d399' : '#f87171'} />
              </div>
              <div className="mt-8 grid gap-4 sm:grid-cols-3">
                <div className="rounded-2xl border border-black/5 bg-black/[0.02] p-4 text-center dark:border-white/10 dark:bg-white/[0.02]">
                  <div className="text-xs uppercase tracking-[0.15em] opacity-60">Score</div>
                  <div className="mt-2 font-display text-2xl font-semibold">{correct}/{questions.length}</div>
                </div>
                <div className="rounded-2xl border border-black/5 bg-black/[0.02] p-4 text-center dark:border-white/10 dark:bg-white/[0.02]">
                  <div className="text-xs uppercase tracking-[0.15em] opacity-60">Percentage</div>
                  <div className="mt-2 font-display text-2xl font-semibold">{percentage}%</div>
                </div>
                <div className="rounded-2xl border border-black/5 bg-black/[0.02] p-4 text-center dark:border-white/10 dark:bg-white/[0.02]">
                  <div className="text-xs uppercase tracking-[0.15em] opacity-60">Result</div>
                  <div className="mt-2 font-display text-2xl font-semibold text-emerald-600 dark:text-emerald-400">{passed ? 'Pass' : 'Fail'}</div>
                </div>
              </div>
              <div className="mt-8 flex justify-center gap-3">
                <button type="button" onClick={() => navigate('#/dashboard')} className="rounded-xl bg-black/5 px-5 py-2.5 font-medium dark:bg-white/10">Back to dashboard</button>
                <button type="button" onClick={() => navigate('#/history')} className="rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-5 py-2.5 font-semibold text-white">View history</button>
              </div>
            </div>
          </Card>
        </div>
      );
    }

    const currentQuestion = questions[current];

    return (
      <div className="min-h-screen flex flex-col bg-[#f6f7fb] dark:bg-[#090b14]">
        <header className="sticky top-0 z-30 flex items-center justify-between border-b border-black/5 bg-[#f6f7fb]/95 px-6 py-4 backdrop-blur-xl dark:border-white/10 dark:bg-[#090b14]/95">
          <div>
            <p className="font-display text-lg font-semibold">{exam.name}</p>
            <p className="text-xs opacity-60">{exam.subject} • Question {current + 1} of {questions.length}</p>
          </div>
          <div className={cx('rounded-2xl border px-3 py-1.5 font-mono text-lg font-semibold', timeLeft <= 60 ? 'border-red-500/20 bg-red-500/10 text-red-600 dark:text-red-400' : 'border-black/5 bg-black/5 dark:border-white/10 dark:bg-white/5')}>
            {fmtTime(timeLeft)}
          </div>
        </header>

        <div className="flex flex-1 flex-col md:flex-row">
          <aside className="w-full border-r border-black/5 p-5 dark:border-white/10 md:w-72">
            <p className="mb-3 text-xs font-semibold uppercase tracking-[0.2em] opacity-60">Question navigator</p>
            <div className="grid grid-cols-5 gap-2">
              {questions.map((question, index) => {
                let state = 'unanswered';
                if (current === index) state = 'current';
                else if (answers[index] !== undefined) state = 'answered';
                else if (marked[index]) state = 'marked';

                const tokens = {
                  current: 'bg-[#5b7fff] text-white shadow-md',
                  answered: 'bg-emerald-500/75 text-white',
                  marked: 'bg-amber-400/80 text-black',
                  unanswered: 'bg-black/5 dark:bg-white/10',
                };

                return (
                  <button key={question.id || index} type="button" onClick={() => setCurrent(index)} className={cx('h-9 w-9 rounded-lg text-sm font-medium focus-ring', tokens[state])}>
                    {index + 1}
                  </button>
                );
              })}
            </div>
            <div className="mt-5 rounded-2xl border border-black/5 bg-black/[0.02] p-3 dark:border-white/10 dark:bg-white/[0.02]">
              <div className="text-xs uppercase tracking-[0.16em] opacity-60">Progress</div>
              <div className="mt-2 font-display text-xl font-semibold">{Object.keys(answers).length}/{questions.length}</div>
            </div>
            <button type="button" onClick={() => setShowConfirm(true)} className="mt-6 w-full rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-4 py-2.5 font-semibold text-white focus-ring">Submit exam</button>
          </aside>

          <main className="flex-1 p-6 md:p-10">
            <Card className="p-6 md:p-8">
              <div className="mb-5 flex items-center justify-between gap-3">
                <Badge tone="primary">Question {current + 1} of {questions.length}</Badge>
                <button type="button" onClick={() => toggleMark(current)} className={cx('rounded-full border px-3 py-1.5 text-xs font-medium focus-ring', marked[current] ? 'border-amber-400/40 bg-amber-400/20 text-amber-600 dark:text-amber-400' : 'border-black/10 opacity-70 hover:opacity-100 dark:border-white/10')}>
                  {marked[current] ? '★ Marked' : '☆ Mark for review'}
                </button>
              </div>

              <p className="mb-6 text-lg font-medium leading-relaxed md:text-xl">{currentQuestion.text}</p>

              <div className="space-y-3">
                {currentQuestion.options.map((option, optionIndex) => (
                  <button key={optionIndex} type="button" onClick={() => selectAnswer(current, optionIndex)} className={cx('flex w-full items-center gap-3 rounded-2xl border px-5 py-3.5 text-left transition focus-ring', answers[current] === optionIndex ? 'border-[#5b7fff] bg-[#5b7fff]/10 shadow-sm' : 'border-black/10 hover:border-[#5b7fff]/40 hover:bg-black/[0.02] dark:border-white/10 dark:hover:bg-white/[0.03]')}>
                    <span className={cx('flex h-7 w-7 items-center justify-center rounded-full text-xs font-mono', answers[current] === optionIndex ? 'bg-[#5b7fff] text-white' : 'bg-black/5 dark:bg-white/10')}>{String.fromCharCode(65 + optionIndex)}</span>
                    <span className="flex-1">{option}</span>
                  </button>
                ))}
              </div>

              <div className="mt-8 flex items-center justify-between">
                <button type="button" onClick={() => setCurrent(current - 1)} disabled={current === 0} className="rounded-xl bg-black/5 px-5 py-2.5 font-medium disabled:opacity-40 dark:bg-white/10">← Previous</button>
                <button type="button" onClick={() => setCurrent(current + 1)} disabled={current === questions.length - 1} className="rounded-xl bg-black/5 px-5 py-2.5 font-medium disabled:opacity-40 dark:bg-white/10">Next →</button>
              </div>
            </Card>
          </main>
        </div>

        {showConfirm && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-6">
            <Card className="w-full max-w-md p-6">
              <h3 className="mb-2 font-display text-lg font-semibold">Submit this exam?</h3>
              <p className="text-sm opacity-70">You have answered {Object.keys(answers).length} of {questions.length} questions.</p>
              <div className="mt-5 flex gap-3">
                <button type="button" onClick={() => setShowConfirm(false)} className="flex-1 rounded-xl bg-black/5 px-4 py-2.5 font-medium dark:bg-white/10">Keep working</button>
                <button type="button" onClick={() => { setShowConfirm(false); submitExam(); }} className="flex-1 rounded-xl bg-gradient-to-r from-[#5b7fff] to-[#8a6bff] px-4 py-2.5 font-semibold text-white">Submit now</button>
              </div>
            </Card>
          </div>
        )}
      </div>
    );
  }

  function Root() {
    const [theme, setThemeState] = useState('system');
    const [db, setDb] = useState(readDb);
    const [user, setUser] = useState(null);
    const [authTransition, setAuthTransition] = useState(null);
    const hash = useHashRoute();

    useEffect(() => {
      writeDb(db);
    }, [db]);

    useEffect(() => {
      const root = document.documentElement;
      const applyTheme = selected => {
        const dark = selected === 'dark' || (selected === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
      };
      applyTheme(theme);
    }, [theme]);

    const updateDb = updater => {
      setDb(current => {
        const next = typeof updater === 'function' ? updater(current) : updater;
        return next;
      });
    };

    const login = (role, credentials) => {
      const identifier = (credentials.email || '').trim().toLowerCase();
      const password = credentials.password || '';

      const account = (db.users || []).find(userRecord => {
        const matchesEmail = userRecord.email && userRecord.email.toLowerCase() === identifier;
        const matchesId = userRecord.studentId && userRecord.studentId.toLowerCase() === identifier;
        return userRecord.role === role && (matchesEmail || matchesId) && userRecord.password === password;
      });

      if (!account) {
        return { ok: false, message: 'Invalid email or password.' };
      }

      const profile = {
        ...account,
        avatarColor: role === 'admin' ? '#8a6bff' : '#5b7fff',
        studentId: account.studentId || account.id,
        department: account.department || 'General',
      };

      setUser(profile);
      setAuthTransition({ role: profile.role, name: profile.name, id: profile.id });

      window.setTimeout(() => {
        navigate(role === 'admin' ? '#/admin' : '#/dashboard');
        window.setTimeout(() => setAuthTransition(null), 220);
      }, 1200);

      return { ok: true, user: profile };
    };

    const register = form => {
      const student = {
        id: `STU-${Math.floor(Math.random() * 9000 + 1000)}`,
        role: 'student',
        name: form.name,
        email: form.email,
        password: form.password,
        studentId: form.studentId || `STU-${Math.floor(Math.random() * 9000 + 1000)}`,
        department: form.department || 'General',
        createdAt: Date.now(),
      };

      updateDb(current => ({ ...current, users: [...(current.users || []), student] }));
      return true;
    };

    const logout = () => {
      setUser(null);
      navigate('#/login/student');
    };

    const path = hash.replace('#', '') || '/';
    let view;

    if (path.startsWith('/register')) {
      view = <RegisterPage />;
    } else if (path.startsWith('/login/admin')) {
      view = <LoginGate role="admin" />;
    } else if (path.startsWith('/login/student')) {
      view = <LoginGate role="student" />;
    } else if (path.startsWith('/exam/')) {
      const examId = path.split('/')[2];
      if (user && user.role === 'student') {
        view = <ExamPage examId={examId} />;
      } else {
        view = <LoginGate role="student" />;
      }
    } else if (path.startsWith('/exams')) {
      view = user && user.role === 'student' ? <ExamsListPage /> : <LoginGate role="student" />;
    } else if (path.startsWith('/history')) {
      view = user && user.role === 'student' ? <HistoryPage /> : <LoginGate role="student" />;
    } else if (path.startsWith('/performance')) {
      view = user && user.role === 'student' ? <PerformancePage /> : <LoginGate role="student" />;
    } else if (path.startsWith('/profile')) {
      view = user && user.role === 'student' ? <ProfilePage /> : <LoginGate role="student" />;
    } else if (path.startsWith('/admin/exams')) {
      view = user && user.role === 'admin' ? <AdminExamsPage /> : <LoginGate role="admin" />;
    } else if (path.startsWith('/admin/questions')) {
      view = user && user.role === 'admin' ? <AdminQuestionsPage /> : <LoginGate role="admin" />;
    } else if (path.startsWith('/admin/students')) {
      view = user && user.role === 'admin' ? <AdminStudentsPage /> : <LoginGate role="admin" />;
    } else if (path.startsWith('/admin/reports')) {
      view = user && user.role === 'admin' ? <AdminResultsPage /> : <LoginGate role="admin" />;
    } else if (path.startsWith('/admin')) {
      view = user && user.role === 'admin' ? <AdminDashboard /> : <LoginGate role="admin" />;
    } else if (path.startsWith('/dashboard')) {
      view = user && user.role === 'student' ? <StudentDashboard /> : <LoginGate role="student" />;
    } else {
      view = <LandingPage />;
    }

    const contextValue = { db, updateDb, theme, setTheme: setThemeState, user, login, register, logout };

    return (
      <AppCtx.Provider value={contextValue}>
        {authTransition && <AuthTransition role={authTransition.role} name={authTransition.name} id={authTransition.id} />}
        {view}
      </AppCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
